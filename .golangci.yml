version: "2"
run:
  concurrency: 4
  modules-download-mode: vendor
  issues-exit-code: 1
  tests: true
output:
  formats:
    text:
      path: stdout
      print-linter-name: true
      print-issued-lines: true
      colors: true
linters:
  default: none
  enable:
    - errcheck
    - gosec
    - ineffassign
    - misspell
    - nakedret
    - revive
    - staticcheck
    - unparam
    - unused
    - misspell
    - unparam
    - revive
    - unconvert
    - unparam
  settings:
    dupl:
      threshold: 100
    errcheck:
      check-type-assertions: false
      check-blank: true
    goconst:
      min-len: 3
      min-occurrences: 3
    gocyclo:
      min-complexity: 10
    lll:
      line-length: 120
      tab-width: 1
    misspell:
      locale: US
    nakedret:
      max-func-lines: 30
    prealloc:
      simple: true
      range-loops: true
      for-loops: false
    unparam:
      check-exported: false
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
      # npm dependencies of the Angular front-ends. The flatted package ships a
      # Go file, so `./...` walks into it and reports issues in third-party code
      # that is not ours to fix. These directories only exist after npm install,
      # which CI now runs for all three front-ends.
      - (^|/)node_modules/
      - cmd/hardware-wallet
      - src/hardware-wallet/usb/lowlevel/
      - src/cipher/debug_
      - src/cipher/secp256k1-go/debug_
    rules:
      # gosec, scoped rather than silenced globally.
      #
      # These three are systematic: every hit is the same intentional pattern in
      # the same kind of file, so a per-site //nolint on each of ~55 lines would
      # be noise nobody maintains. Everything outside these paths still reports,
      # and genuine one-offs carry //nolint with a reason at the site.
      - linters:
          - gosec
        text: "G101:"          # test vectors, not credentials
        path: _test\.go
      - linters:
          - gosec
        text: "G117:"          # fixtures that intentionally carry a password field
        path: _test\.go
      - linters:
          - gosec
        text: "G115:"          # deliberate truncation while packing bytes
        path: "src/(cipher|btc)/"
      - linters:
          - gosec
        # G120 is taint-based: it flags r.FormValue in the node's HTTP handlers
        # and explores as far as its analysis budget allows, so a different
        # subset of handlers is reported on each run and per-site //nolint cannot
        # keep up. The API server sets its own body limits; these calls read a
        # single query parameter.
        text: "G120:"
        path: "src/api/"
      - linters:
          - revive
        text: "var-naming: avoid meaningless package names"
      - linters:
          - revive
        text: "var-naming: avoid package names that conflict with Go standard library"
      - linters:
          - misspell
        path: src/cipher/bip39/wordlists/
      - linters:
          - staticcheck
        text: "QF1003:" # could use tagged switch on errCode (staticcheck)
      - linters:
          - staticcheck
        text: "ST1005:" # error strings should not be capitalized (staticcheck)
      - linters:
          - staticcheck
        text: "QF1008:" # could remove embedded field "Common" from selector (staticcheck)
      - linters:
          - staticcheck
        text: "QF1001:" # could apply De Morgan's law (staticcheck)
      - linters:
          - staticcheck
        text: "QF1002:" # could use tagged switch on rs.Type (staticcheck)
      - linters:
          - staticcheck
        text: "QF1010:" # could convert argument to string (staticcheck)
      - linters:
          - staticcheck
        text: "QF1004:" # could use strings.ReplaceAll instead (staticcheck)
      - linters:
          - staticcheck
        text: "QF1006:" # could lift into loop condition (staticcheck)
      - linters:
          - staticcheck
        text: "QF1012:" # use fmt.Fprintf instead of WriteString(fmt.Sprintf) (staticcheck)
issues:
  new: false
formatters:
  enable:
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/skycoin/skycoin
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
      - (^|/)node_modules/
