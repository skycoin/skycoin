<div class="container">
  <div class="-buttons">
    <div class="-button -low-opacity" [routerLink]="'/wallets' | walletPath" routerLinkActive="-full-opacity">
      <div>
        <img src="assets/skycoin-wallet/img/wallet-black.png">
        <span>{{ 'title.wallets' | translate }}</span>
      </div>
    </div>
    <div class="-button -low-opacity" [routerLink]="'/send' | walletPath" routerLinkActive="-full-opacity">
      <div>
        <img src="assets/skycoin-wallet/img/send-black.png">
        <span>{{ 'title.send' | translate }}</span>
      </div>
    </div>
    <div class="-button -low-opacity" [routerLink]="'/history' | walletPath" routerLinkActive="-full-opacity">
      <div>
        <img src="assets/skycoin-wallet/img/transactions-black.png">
        <span>{{ 'title.history' | translate }}</span>
      </div>
    </div>
    <div class="flex-fill -not-on-small-and-below"></div>
    @if (false) {
      <div class="-button -not-on-small-and-below">
        <img src="assets/skycoin-wallet/img/money-gold.png">
        <span class="secondary-color">{{ 'title.buy-coin' | translate }}</span>
      </div>
    }

    @if (navbarService.switchVisible) {
      <app-double-button
        class="-switch -not-on-small-and-below"
        [leftButtonText]="navbarService.leftText | translate"
        [rightButtonText]="navbarService.rightText | translate"
        [activeButton]="(navbarService.activeComponent | async)!"
        className="light"
        (onStateChange)="changeActiveComponent($event)">
      </app-double-button>
    }

  </div>
</div>

<div class="-on-small-and-below-only">
  @if (navbarService.switchVisible) {
    <app-double-button
      class="-switch"
      [leftButtonText]="navbarService.leftText | translate"
      [rightButtonText]="navbarService.rightText | translate"
      [activeButton]="(navbarService.activeComponent | async)!"
      className="grey"
      (onStateChange)="changeActiveComponent($event)">
    </app-double-button>
  }
</div>
