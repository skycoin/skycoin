<app-modal
  [headline]="(changingExistingPin ? 'hardware-wallet.options.change-pin' : 'hardware-wallet.options.create-pin') | translate"
  [dialog]="dialogRef"
  [disableDismiss]="currentState === states.Initial">
  <!-- Initial instructions. -->
  @if (currentState === states.Initial) {
    <app-hw-message
      [text]="'hardware-wallet.general.confirm' | translate"
      [icon]="msgIcons.Confirm"
    ></app-hw-message>
  }

  <!-- Result. -->
  @if (currentState === states.ShowingResult) {
    <app-hw-message
      [text]="result.text | translate"
      [icon]="result.icon"
    ></app-hw-message>
  }

  <!-- Buttons area. -->
  @if (currentState !== states.Initial) {
    <div class="-buttons">
      <app-button (action)="closeModal()" class="primary-button" #closeButton>
        {{ 'common.close-button' | translate }}
      </app-button>
    </div>
  }
</app-modal>
