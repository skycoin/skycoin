on:
  pull_request:
    branches: [ master, develop, cobra-cli ]
  push:
    branches: [ master, develop, cobra-cli ]

name: CI

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.*
          cache: true
          cache-dependency-path: go.sum

      - name: Cache Go tools
        uses: actions/cache@v4
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-go-tools-${{ hashFiles('Makefile') }}
          restore-keys: |
            ${{ runner.os }}-go-tools-

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            ${{ runner.os }}-apt-

      - name: Install Dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb libusb-1.0-0-dev

      - name: Vendor Dependencies
        run: go mod vendor -v

      - name: Install linters
        run: make install-linters

      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.5.0

      - name: Format Check
        run: |
          make format
          git diff --exit-code || (echo "Code is not formatted. Run 'make format' locally." && exit 1)

      - name: Run Unit Tests
        run: make test

      - name: Run Unit Tests (386)
        run: make test-386

      - name: Run Integration Tests
        run: |
          Xvfb -ac :99 -screen 0 1280x1024x16 &
          export DISPLAY=:99
          make integration-tests-stable

      - name: Check newcoin Template
        run: make check-newcoin

  darwin:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.*
          cache: true
          cache-dependency-path: go.sum

      - name: Cache Go tools
        uses: actions/cache@v4
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-go-tools-${{ hashFiles('Makefile') }}
          restore-keys: |
            ${{ runner.os }}-go-tools-

      - name: Vendor Dependencies
        run: go mod vendor -v

      - name: Install linters
        run: make install-linters

      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.5.0

      - name: Format Check
        run: |
          make format
          git diff --exit-code || (echo "Code is not formatted. Run 'make format' locally." && exit 1)

      - name: Run Unit Tests
        run: make test

      - name: Run Unit Tests (386)
        run: make test-386

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.*
          cache: true
          cache-dependency-path: go.sum

      - name: Cache Go tools
        uses: actions/cache@v4
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-go-tools-${{ hashFiles('Makefile') }}
          restore-keys: |
            ${{ runner.os }}-go-tools-

      - name: Install Dependencies
        run: |
          choco install make

      - name: Vendor Dependencies
        run: go mod vendor -v

      - name: Run Unit Tests
        run: make test

      - name: Run Unit Tests (amd64)
        run: make test-amd64
