name: Release
on:
  push:
    tags:
      - 'v*'

env:
  GO_VERSION: '1.26.5'
  MUSL_RELEASE: 'v1.3.29'
  MODULE: github.com/skycoin/skycoin

# Needed for gh release create / upload with the default GITHUB_TOKEN.
permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo ${{ github.repository }} \
            --title "${{ github.ref_name }}" \
            --draft \
            --generate-notes || true

  # Main skycoin binary: pure Go (CGO disabled), built from the repository root
  # (github.com/skycoin/skycoin). No hardware-wallet (that is cgo/libusb, built
  # separately below) and no musl toolchain needed. Matches the TinyGo build's
  # feature set. Cross-compiles to every arch with plain GOOS/GOARCH.
  linux:
    needs: create-release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, goarch: amd64 }
          - { arch: arm64, goarch: arm64 }
          - { arch: arm, goarch: arm, goarm: "6" }
          - { arch: armhf, goarch: arm, goarm: "7" }
          - { arch: "386", goarch: "386" }
          - { arch: riscv64, goarch: riscv64 }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Build skycoin (pure Go, from repo root)
        env:
          GOPROXY: direct
          GOSUMDB: "off"
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          mkdir -p bin
          go build -trimpath -ldflags "-s -w -buildid=" -o bin/skycoin .
          if [ "${{ matrix.arch }}" = "amd64" ]; then ./bin/skycoin --help || true; fi

      - name: Create archive
        run: |
          ARCHIVE_NAME="skycoin-${{ github.ref_name }}-linux-${{ matrix.arch }}"
          mkdir -p dist
          cp bin/skycoin dist/
          cd dist
          tar -czvf "${ARCHIVE_NAME}.tar.gz" skycoin
          sha256sum "${ARCHIVE_NAME}.tar.gz" > "${ARCHIVE_NAME}.tar.gz.sha256"

      - name: Upload to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            dist/skycoin-${{ github.ref_name }}-linux-${{ matrix.arch }}.tar.gz \
            dist/skycoin-${{ github.ref_name }}-linux-${{ matrix.arch }}.tar.gz.sha256 \
            --repo ${{ github.repository }} \
            --clobber

  # Hardware-wallet utilities: cgo/libusb, statically linked against musl, in
  # their own "skyhw" archive (separate from the main skycoin binary). This is
  # the one piece that keeps the musl cross-toolchain machinery.
  linux-hardware-wallet:
    needs: create-release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            goarch: amd64
            toolchain: x86_64-linux-musl
            toolchain_file: x86_64-linux-musl-cross.tgz
          - arch: arm64
            goarch: arm64
            toolchain: aarch64-linux-musl
            toolchain_file: aarch64-linux-musl-cross.tgz
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y wget tar libusb-1.0-0-dev autoconf automake libtool

      - name: Fetch build-libusb-musl.sh
        run: |
          curl -sL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/ci-scripts/build-libusb-musl.sh" -o build-libusb-musl.sh
          chmod +x build-libusb-musl.sh

      - name: Cache musl toolchain
        id: cache-toolchain
        uses: actions/cache@v5
        with:
          path: musl-data
          key: musl-${{ env.MUSL_RELEASE }}-${{ matrix.toolchain }}

      - name: Download musl toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          mkdir -p musl-data
          wget -q "https://github.com/skycoin/skywire/releases/download/${{ env.MUSL_RELEASE }}/${{ matrix.toolchain_file }}"
          tar -xzf "${{ matrix.toolchain_file }}" -C ./musl-data
          rm "${{ matrix.toolchain_file }}"

      - name: Build libusb for musl target
        run: ./build-libusb-musl.sh ${{ matrix.arch }} ${{ matrix.toolchain }} ./musl-data/${{ matrix.toolchain }}-cross

      - name: Build hardware-wallet utility (musl static)
        env:
          GOPROXY: direct
          GOSUMDB: "off"
          CGO_ENABLED: "1"
          CC: ${{ github.workspace }}/musl-data/${{ matrix.toolchain }}-cross/bin/${{ matrix.toolchain }}-gcc
          PKG_CONFIG_PATH: ${{ github.workspace }}/musl-data/${{ matrix.toolchain }}-cross/${{ matrix.toolchain }}/lib/pkgconfig
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p bin
          go build -tags=cgo -trimpath \
            -ldflags "-s -w -linkmode external -extldflags '-static' -buildid=" \
            -o bin/skyhw ./cmd/hardware-wallet

      - name: Create archive
        run: |
          ARCHIVE_NAME="skyhw-${{ github.ref_name }}-linux-${{ matrix.arch }}"
          mkdir -p dist
          cp bin/skyhw dist/
          cd dist
          tar -czvf "${ARCHIVE_NAME}.tar.gz" skyhw
          sha256sum "${ARCHIVE_NAME}.tar.gz" > "${ARCHIVE_NAME}.tar.gz.sha256"

      - name: Upload to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            dist/skyhw-${{ github.ref_name }}-linux-${{ matrix.arch }}.tar.gz \
            dist/skyhw-${{ github.ref_name }}-linux-${{ matrix.arch }}.tar.gz.sha256 \
            --repo ${{ github.repository }} \
            --clobber

  # TinyGo build: a separate, much smaller Linux/amd64 skycoin binary compiled
  # with the TinyGo fork (github.com/0magnet/tinygo). It has no cgo, so no
  # hardware-wallet support, and it embeds the TinyGo-compiled skycoin-lite wasm.
  # Uploaded as a distinct "-tinygo" archive alongside the standard-go archives.
  linux-tinygo:
    needs: create-release
    runs-on: ubuntu-latest
    env:
      TINYGO_REPO: https://github.com/0magnet/tinygo.git
      TINYGO_TAG: v0.42.0-skycoin.1
    steps:
      - name: Checkout skycoin
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Install LLVM 22 (apt.llvm.org)
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get install -y llvm-22-dev libclang-22-dev clang-22 lld-22

      - name: Build the TinyGo fork
        run: |
          git clone --branch "${TINYGO_TAG}" --recurse-submodules --depth 1 \
            "${TINYGO_REPO}" "${GITHUB_WORKSPACE}/tinygo-fork"
          cd "${GITHUB_WORKSPACE}/tinygo-fork"
          go build -tags llvm22 -o "${GITHUB_WORKSPACE}/tinygo-fork/build/tinygo" .
          ./build/tinygo version

      - name: Fetch compiler-rt builtins
        run: |
          # compiler-rt is not a submodule; the TinyGo release packaging copies
          # its builtins into lib/compiler-rt-builtins. Reproduce that for a
          # source checkout so `tinygo build` can find them.
          git clone --filter=blob:none --sparse --depth 1 -b tinygo_20.x \
            https://github.com/tinygo-org/llvm-project.git /tmp/llvm-project
          git -C /tmp/llvm-project sparse-checkout set compiler-rt/lib/builtins
          cp -rp /tmp/llvm-project/compiler-rt/lib/builtins \
            "${GITHUB_WORKSPACE}/tinygo-fork/lib/compiler-rt-builtins"

      - name: Build skycoin with TinyGo
        env:
          # Point TINYGOROOT at the fork checkout so its src/ and targets/ are used.
          TINYGOROOT: ${{ github.workspace }}/tinygo-fork
        run: |
          mkdir -p bin
          # -opt=z (optimize for size) + --no-debug for the smallest binary.
          "${GITHUB_WORKSPACE}/tinygo-fork/build/tinygo" build \
            -gc=precise -opt=z --no-debug -tags "safe netgo" \
            -o bin/skycoin .
          # non-TTY --help must not panic (colored-help fork renders plainly here)
          ./bin/skycoin --help || true

      - name: Create archive
        run: |
          ARCHIVE_NAME="skycoin-${{ github.ref_name }}-linux-amd64-tinygo"
          mkdir -p dist
          cp bin/skycoin dist/
          cd dist
          tar -czvf "${ARCHIVE_NAME}.tar.gz" skycoin
          sha256sum "${ARCHIVE_NAME}.tar.gz" > "${ARCHIVE_NAME}.tar.gz.sha256"

      - name: Upload to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            dist/skycoin-${{ github.ref_name }}-linux-amd64-tinygo.tar.gz \
            dist/skycoin-${{ github.ref_name }}-linux-amd64-tinygo.tar.gz.sha256 \
            --repo ${{ github.repository }} \
            --clobber

  darwin-amd64:
    needs: create-release
    # go install @tag resolves the upstream module path, so these platform
    # builds only run for the canonical repo (not fork alpha tags). Linux is
    # built from a checkout and runs everywhere.
    if: github.repository == 'skycoin/skycoin'
    runs-on: macos-15-intel
    steps:
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Install Requirements
        run: |
          brew install --quiet libusb || brew upgrade --quiet libusb
          brew install --quiet hidapi || brew upgrade --quiet hidapi

      - name: Build skycoin
        env:
          GOPROXY: direct
          GOSUMDB: "off"
          CGO_ENABLED: "1"
          CGO_CFLAGS: -I/usr/local/include -I/opt/homebrew/include -I/opt/homebrew/opt/hidapi/include -I/opt/homebrew/opt/libusb/include
          CGO_LDFLAGS: -L/usr/local/lib -L/opt/homebrew/lib -L/opt/homebrew/opt/hidapi/lib -L/opt/homebrew/opt/libusb/lib
        run: |
          go install -trimpath -ldflags "-s -w" \
            ${{ env.MODULE }}@${{ github.ref_name }}

          mkdir -p bin
          cp "$(go env GOPATH)/bin/skycoin" bin/skycoin
          ./bin/skycoin || true
          ./bin/skycoin daemon --help || true

      - name: Create archive
        run: |
          ARCHIVE_NAME="skycoin-${{ github.ref_name }}-darwin-amd64"
          mkdir -p dist
          cp bin/skycoin dist/
          cd dist
          tar -czvf "${ARCHIVE_NAME}.tar.gz" skycoin
          shasum -a 256 "${ARCHIVE_NAME}.tar.gz" > "${ARCHIVE_NAME}.tar.gz.sha256"

      - name: Create macOS package
        run: |
          PKG_NAME="skycoin-${{ github.ref_name }}-darwin-amd64"
          mkdir -p pkg-root/usr/local/bin
          cp bin/skycoin pkg-root/usr/local/bin/
          pkgbuild --root pkg-root \
            --identifier com.skycoin.skycoin \
            --version "${{ github.ref_name }}" \
            --install-location / \
            "dist/${PKG_NAME}.pkg"
          shasum -a 256 "dist/${PKG_NAME}.pkg" > "dist/${PKG_NAME}.pkg.sha256"

      - name: Upload to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            dist/skycoin-${{ github.ref_name }}-darwin-amd64.tar.gz \
            dist/skycoin-${{ github.ref_name }}-darwin-amd64.tar.gz.sha256 \
            dist/skycoin-${{ github.ref_name }}-darwin-amd64.pkg \
            dist/skycoin-${{ github.ref_name }}-darwin-amd64.pkg.sha256 \
            --repo ${{ github.repository }} \
            --clobber

  darwin-arm64:
    needs: create-release
    # go install @tag resolves the upstream module path, so these platform
    # builds only run for the canonical repo (not fork alpha tags). Linux is
    # built from a checkout and runs everywhere.
    if: github.repository == 'skycoin/skycoin'
    runs-on: macos-latest
    steps:
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Install Requirements
        run: |
          brew install --quiet libusb || brew upgrade --quiet libusb
          brew install --quiet hidapi || brew upgrade --quiet hidapi

      - name: Build skycoin
        env:
          GOPROXY: direct
          GOSUMDB: "off"
          CGO_ENABLED: "1"
          CGO_CFLAGS: -I/opt/homebrew/include -I/opt/homebrew/opt/hidapi/include -I/opt/homebrew/opt/libusb/include
          CGO_LDFLAGS: -L/opt/homebrew/lib -L/opt/homebrew/opt/hidapi/lib -L/opt/homebrew/opt/libusb/lib
        run: |
          go install -trimpath -ldflags "-s -w" \
            ${{ env.MODULE }}@${{ github.ref_name }}

          mkdir -p bin
          cp "$(go env GOPATH)/bin/skycoin" bin/skycoin
          ./bin/skycoin || true
          ./bin/skycoin daemon --help || true

      - name: Create archive
        run: |
          ARCHIVE_NAME="skycoin-${{ github.ref_name }}-darwin-arm64"
          mkdir -p dist
          cp bin/skycoin dist/
          cd dist
          tar -czvf "${ARCHIVE_NAME}.tar.gz" skycoin
          shasum -a 256 "${ARCHIVE_NAME}.tar.gz" > "${ARCHIVE_NAME}.tar.gz.sha256"

      - name: Create macOS package
        run: |
          PKG_NAME="skycoin-${{ github.ref_name }}-darwin-arm64"
          mkdir -p pkg-root/usr/local/bin
          cp bin/skycoin pkg-root/usr/local/bin/
          pkgbuild --root pkg-root \
            --identifier com.skycoin.skycoin \
            --version "${{ github.ref_name }}" \
            --install-location / \
            "dist/${PKG_NAME}.pkg"
          shasum -a 256 "dist/${PKG_NAME}.pkg" > "dist/${PKG_NAME}.pkg.sha256"

      - name: Upload to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            dist/skycoin-${{ github.ref_name }}-darwin-arm64.tar.gz \
            dist/skycoin-${{ github.ref_name }}-darwin-arm64.tar.gz.sha256 \
            dist/skycoin-${{ github.ref_name }}-darwin-arm64.pkg \
            dist/skycoin-${{ github.ref_name }}-darwin-arm64.pkg.sha256 \
            --repo ${{ github.repository }} \
            --clobber

  windows:
    needs: create-release
    # go install @tag resolves the upstream module path, so these platform
    # builds only run for the canonical repo (not fork alpha tags). Linux is
    # built from a checkout and runs everywhere.
    if: github.repository == 'skycoin/skycoin'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            goarch: amd64
            wix_arch: x64
            cgo_enabled: "1"
          - arch: "386"
            goarch: "386"
            wix_arch: x86
            cgo_enabled: "0"
          - arch: arm64
            goarch: arm64
            wix_arch: x64
            cgo_enabled: "0"
    steps:
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Install CGO Requirements
        if: matrix.arch == 'amd64'
        shell: pwsh
        run: |
          C:\msys64\usr\bin\bash.exe -lc "pacman -S --noconfirm mingw-w64-x86_64-libusb mingw-w64-x86_64-hidapi mingw-w64-x86_64-pkg-config"
          echo "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Fetch Windows installer files
        if: matrix.arch != 'arm64'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "scripts\win_installer"
          Invoke-WebRequest "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/scripts/win_installer/Product.wxs" -OutFile "scripts\win_installer\Product.wxs"

      - name: Build skycoin
        env:
          GOPROXY: direct
          GOSUMDB: "off"
          CGO_ENABLED: ${{ matrix.cgo_enabled }}
          CGO_CFLAGS: -IC:/msys64/mingw64/include -IC:/msys64/mingw64/include/libusb-1.0
          CGO_LDFLAGS: -LC:/msys64/mingw64/lib
          GOOS: windows
          GOARCH: ${{ matrix.goarch }}
        shell: pwsh
        run: |
          go install -trimpath -ldflags "-s -w" "${{ env.MODULE }}@${{ github.ref_name }}"

          New-Item -ItemType Directory -Force -Path "bin"
          $gopath = go env GOPATH
          $crossPath = "$gopath\bin\windows_${{ matrix.goarch }}\skycoin.exe"
          $nativePath = "$gopath\bin\skycoin.exe"

          if (Test-Path $crossPath) {
            Copy-Item $crossPath "bin\skycoin.exe"
          } elseif (Test-Path $nativePath) {
            Copy-Item $nativePath "bin\skycoin.exe"
          } else {
            Write-Error "Binary not found"
            Get-ChildItem -Recurse "$gopath\bin" -Filter "release*"
            exit 1
          }

          # Verify binary (amd64 and 386 can run on amd64 runner)
          if ("${{ matrix.arch }}" -ne "arm64") {
            & "bin\skycoin.exe"
            & "bin\skycoin.exe" daemon --help
          }

      - name: Build hardware wallet utility
        if: matrix.arch == 'amd64'
        env:
          GOPROXY: direct
          GOSUMDB: "off"
          CGO_ENABLED: "1"
          CGO_CFLAGS: -IC:/msys64/mingw64/include -IC:/msys64/mingw64/include/libusb-1.0
          CGO_LDFLAGS: -LC:/msys64/mingw64/lib
          GOOS: windows
          GOARCH: amd64
        shell: pwsh
        run: |
          go install -trimpath -ldflags "-s -w" "${{ env.MODULE }}/cmd/hardware-wallet@${{ github.ref_name }}"

          $gopath = go env GOPATH
          $hwPath = "$gopath\bin\hardware-wallet.exe"
          if (Test-Path $hwPath) {
            Copy-Item $hwPath "bin\skyhw.exe"
          } else {
            Write-Warning "Hardware wallet binary not found, skipping"
          }

      - name: Create archive
        shell: pwsh
        run: |
          $ARCHIVE_NAME = "skycoin-${{ github.ref_name }}-windows-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force -Path "dist"
          Copy-Item "bin\skycoin.exe" "dist\"

          # Include hardware wallet binary and required DLLs if present
          if (Test-Path "bin\skyhw.exe") {
            Copy-Item "bin\skyhw.exe" "dist\"
            $dllDir = "C:\msys64\mingw64\bin"
            foreach ($dll in @("libhidapi-0.dll", "libusb-1.0.dll")) {
              $dllPath = "$dllDir\$dll"
              if (Test-Path $dllPath) {
                Copy-Item $dllPath "dist\"
              }
            }
          }

          Compress-Archive -Path "dist\*" -DestinationPath "dist\$ARCHIVE_NAME.zip"
          Get-FileHash "dist\$ARCHIVE_NAME.zip" -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $ARCHIVE_NAME.zip" } > "dist\$ARCHIVE_NAME.zip.sha256"
          Get-ChildItem "dist\" -Exclude "*.zip","*.sha256" | Remove-Item

      - name: Create MSI installer
        if: matrix.arch != 'arm64'
        shell: pwsh
        run: |
          $MSI_NAME = "skycoin-installer-${{ github.ref_name }}-windows-${{ matrix.arch }}"
          $VERSION = "${{ github.ref_name }}" -replace '(^v|-.+$)', ''

          # Download WiX 3.11
          Invoke-WebRequest "https://github.com/wixtoolset/wix3/releases/download/wix3112rtm/wix311-binaries.zip" -OutFile wix.zip
          Expand-Archive wix.zip -DestinationPath wix

          # Prepare build directory
          Set-Location scripts\win_installer
          New-Item -ItemType Directory -Force -Path "build"
          Copy-Item ..\..\bin\skycoin.exe build\skycoin.exe

          # Include hardware wallet binary and DLLs for amd64
          if (Test-Path "..\..\bin\skyhw.exe") {
            Copy-Item ..\..\bin\skyhw.exe build\skyhw.exe
            $dllDir = "C:\msys64\mingw64\bin"
            foreach ($dll in @("libhidapi-0.dll", "libusb-1.0.dll")) {
              $dllPath = "$dllDir\$dll"
              if (Test-Path $dllPath) {
                Copy-Item $dllPath build\
              }
            }
          }

          # Update version in Product.wxs
          $productWxs = Get-Content -Path Product.wxs -Raw
          $productWxs = $productWxs -replace "skycoinVersion", $VERSION
          Set-Content -Path Product.wxs -Value $productWxs

          # Build MSI
          ..\..\wix\candle.exe Product.wxs -arch ${{ matrix.wix_arch }}
          ..\..\wix\light.exe -ext WixUIExtension -ext WixUtilExtension -sacl -spdb -out skycoin.msi Product.wixobj
          Move-Item skycoin.msi ..\..\dist\$MSI_NAME.msi

          Set-Location ..\..
          Get-FileHash "dist\$MSI_NAME.msi" -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $MSI_NAME.msi" } > "dist\$MSI_NAME.msi.sha256"

      - name: Upload to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $files = @(
            "dist\skycoin-${{ github.ref_name }}-windows-${{ matrix.arch }}.zip",
            "dist\skycoin-${{ github.ref_name }}-windows-${{ matrix.arch }}.zip.sha256"
          )
          $msi = "dist\skycoin-installer-${{ github.ref_name }}-windows-${{ matrix.arch }}.msi"
          $msiSha = "dist\skycoin-installer-${{ github.ref_name }}-windows-${{ matrix.arch }}.msi.sha256"
          if (Test-Path $msi) {
            $files += $msi
            $files += $msiSha
          }
          gh release upload "${{ github.ref_name }}" @files --repo ${{ github.repository }} --clobber

  create-checksums:
    needs: [linux, linux-hardware-wallet, linux-tinygo, darwin-amd64, darwin-arm64, windows]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all checksums and create combined file
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ github.ref_name }}" --repo ${{ github.repository }} --pattern "*.sha256"
          cat *.sha256 > checksums.txt

      - name: Upload combined checksums
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" checksums.txt \
            --repo ${{ github.repository }} \
            --clobber
