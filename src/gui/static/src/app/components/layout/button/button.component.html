<div class="internal-container">
  <button
    mat-button
    mat-raised-button
    color="primary"
    [disabled]="disabled && !forceEmitEvents"
    (click)="this.state !== buttonStates.Loading ? onClick() : null"
    [ngClass]="{ enabled: !disabled }"
    #button
    >
    <div class="content-container">
      <span class="content"><ng-content></ng-content></span>
      @if (state === buttonStates.Success) {
        <mat-icon>done</mat-icon>
      }
      @if (state === buttonStates.Loading) {
        <mat-spinner></mat-spinner>
      }
    </div>
  </button>
</div>
