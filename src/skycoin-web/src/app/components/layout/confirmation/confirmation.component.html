<app-modal class="modal" [class.red-title]="data.redTitle" [headline]="data.headerText | translate" [dialog]="dialogRef" [disableDismiss]="disableDismiss">
  <div class="-body">
    {{ data.text | translate }}
  </div>

  @if (data.checkboxText) {
    <div class="-check-container">
      <mat-checkbox type="checkbox"
        class="-check-text -check"
        id="terms"
        [checked]="accepted"
        (change)="setAccept($event)">{{ data.checkboxText | translate }}
      </mat-checkbox>
    </div>
  }

  <div class="small-screen-margin"></div>

  <div class="-buttons">
    @if (data.cancelButtonText) {
      <app-button (action)="closeModal(false)">
        {{ data.cancelButtonText | translate }}
      </app-button>
    }
    <app-button (action)="closeModal(true)" class="primary" [disabled]="!!(data.checkboxText && !accepted)">
      {{ data.confirmButtonText | translate }}
    </app-button>
  </div>
</app-modal>
