<div class="-content">
  @if (isLoading) {
    <div>
      <mat-spinner [diameter]="40"></mat-spinner>
      <p>{{ 'common.loading' | translate }}</p>
    </div>
  }
  @if (!isLoading) {
    <div>
      <i class="material-icons">announcement</i>
      <p>{{ noDataText | translate }}</p>
    </div>
  }
</div>
