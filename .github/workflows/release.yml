name: Release

on:
  push:
    tags:
      - '*'

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Install Requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y libusb-1.0-0-dev
      
      - name: Releasing
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          make dep-github-release
          make github-release

  darwin:
    needs: linux
    runs-on: macos-latest
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Install Requirements
        run: |
          brew install libusb
          brew install hidapi
      
      - name: Releasing
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make github-release-darwin

  windows:
    needs: darwin
    runs-on: windows-latest
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Install Requirements
        shell: pwsh
        run: |
          choco install make
      
      - name: Releasing
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make github-release-windows
