name: Release

on:
  push:
    tags:
      - '*'

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Install Requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y libusb-1.0-0-dev
      
      - name: Releasing
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          make dep-github-release
          make github-release

  darwin-amd64:
    needs: linux
    runs-on: macos-15-intel
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Install Requirements
        run: |
          brew install libusb
          brew install hidapi
      
      - name: Releasing
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make github-release-darwin-amd64

  darwin-arm64:
    needs: linux
    runs-on: macos-latest  # ARM64 runner
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Install Requirements
        run: |
          brew install libusb
          brew install hidapi
      
      - name: Releasing
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make github-release-darwin-arm64

  windows:
    needs: [darwin-amd64, darwin-arm64]
    runs-on: windows-latest
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Install Requirements
        shell: pwsh
        run: |
          choco install make
          # Install libusb and hidapi via msys2/mingw (compatible with Go/MinGW)
          C:\msys64\usr\bin\bash.exe -lc "pacman -S --noconfirm mingw-w64-x86_64-libusb mingw-w64-x86_64-hidapi mingw-w64-i686-libusb mingw-w64-i686-hidapi"
      
      - name: Releasing
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make github-release-windows
