on:
  pull_request:

name: CI

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.*
          cache: true
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 20.18.1
          cache: 'npm'
          cache-dependency-path: src/gui/static/package-lock.json

      - name: Cache Go tools
        uses: actions/cache@v4
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-go-tools-${{ hashFiles('Makefile') }}
          restore-keys: |
            ${{ runner.os }}-go-tools-

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            ${{ runner.os }}-apt-

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libusb-1.0-0-dev

      - name: Vendor Dependencies
        run: go mod vendor -v

      - name: Install linters
        run: make install-linters

      - name: Lint Go
        run: make lint

      - name: Format Check
        run: |
          make format
          git diff --exit-code || (echo "Code is not formatted. Run 'make format' locally." && exit 1)

      - name: Check newcoin Template
        run: make check-newcoin

      - name: Install UI Dependencies
        run: make install-deps-ui

      - name: Lint UI
        run: make lint-ui

      - name: Test UI
        run: make test-ui

      - name: Build UI
        run: make build-ui-travis

      - name: Run Unit Tests (amd64)
        run: make test-amd64

      - name: Run Unit Tests (386)
        run: make test-386

      - name: Run Integration Tests
        run: |
          Xvfb -ac :99 -screen 0 1280x1024x16 &
          export DISPLAY=:99
          make test-ui-e2e
          make integration-test-stable
          make integration-test-stable-disable-wallet-api
          make integration-test-stable-enable-seed-api
          make integration-test-stable-disable-gui
          make integration-test-stable-disable-csrf
          make integration-test-stable-auth

  darwin:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.*
          cache: true
          cache-dependency-path: go.sum

      - name: Cache Go tools
        uses: actions/cache@v4
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-go-tools-${{ hashFiles('Makefile') }}
          restore-keys: |
            ${{ runner.os }}-go-tools-

      - name: Vendor Dependencies
        run: go mod vendor -v

      - name: Install linters
        run: make install-linters

      - name: Lint Go
        run: make lint

      - name: Format Check
        run: |
          make format
          git diff --exit-code || (echo "Code is not formatted. Run 'make format' locally." && exit 1)

      - name: Check newcoin Template
        run: make check-newcoin

      - name: Run Unit Tests
        run: make test

      - name: Run Unit Tests (386)
        run: make test-386

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.*
          cache: true
          cache-dependency-path: go.sum

      - name: Cache Go tools
        uses: actions/cache@v4
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-go-tools-${{ hashFiles('Makefile') }}
          restore-keys: |
            ${{ runner.os }}-go-tools-

      - name: Install Dependencies
        run: choco install make

      - name: Vendor Dependencies
        run: go mod vendor -v

      - name: Check newcoin Template
        run: make check-newcoin

      - name: Run Unit Tests (amd64)
        run: make test-amd64

      - name: Run Unit Tests
        run: make test
