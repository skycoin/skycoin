# GoReleaser configuration for Windows builds  
# Builds skycoin and skyhw binaries for Windows

version: 2

release:
  github:
    owner: skycoin
    name: skycoin

before:
  hooks:
    - go mod tidy
    - go mod vendor

builds:
  - id: skycoin-amd64
    binary: skycoin
    goos:
      - windows
    goarch:
      - amd64
    env:
      - CGO_ENABLED=1
      - CGO_CFLAGS=-IC:/vcpkg/installed/x64-windows-static/include
      - CGO_LDFLAGS=-LC:/vcpkg/installed/x64-windows-static/lib -lhidapi -lsetupapi
    main: ./
    ldflags: -s -w -X github.com/skycoin/skywire/pkg/skywire-utilities/pkg/buildinfo.version=v{{.Version}} -X github.com/skycoin/skywire/pkg/skywire-utilities/pkg/buildinfo.commit={{.ShortCommit}} -X github.com/skycoin/skywire/pkg/skywire-utilities/pkg/buildinfo.date={{.Date}}

  - id: skyhw-amd64
    binary: skyhw
    goos:
      - windows
    goarch:
      - amd64
    env:
      - CGO_ENABLED=1
      - CGO_CFLAGS=-IC:/vcpkg/installed/x64-windows-static/include
      - CGO_LDFLAGS=-LC:/vcpkg/installed/x64-windows-static/lib -lhidapi -lsetupapi
    main: ./cmd/hardware-wallet/
    ldflags: -s -w -X github.com/skycoin/skywire/pkg/skywire-utilities/pkg/buildinfo.version=v{{.Version}} -X github.com/skycoin/skywire/pkg/skywire-utilities/pkg/buildinfo.commit={{.ShortCommit}} -X github.com/skycoin/skywire/pkg/skywire-utilities/pkg/buildinfo.date={{.Date}}

  - id: skycoin-386
    binary: skycoin
    goos:
      - windows
    goarch:
      - 386
    env:
      - CGO_ENABLED=1
      - CGO_CFLAGS=-IC:/vcpkg/installed/x86-windows-static/include
      - CGO_LDFLAGS=-LC:/vcpkg/installed/x86-windows-static/lib -lhidapi -lsetupapi
    main: ./
    ldflags: -s -w -X github.com/skycoin/skywire/pkg/skywire-utilities/pkg/buildinfo.version=v{{.Version}} -X github.com/skycoin/skywire/pkg/skywire-utilities/pkg/buildinfo.commit={{.ShortCommit}} -X github.com/skycoin/skywire/pkg/skywire-utilities/pkg/buildinfo.date={{.Date}}

  - id: skyhw-386
    binary: skyhw
    goos:
      - windows
    goarch:
      - 386
    env:
      - CGO_ENABLED=1
      - CGO_CFLAGS=-IC:/vcpkg/installed/x86-windows-static/include
      - CGO_LDFLAGS=-LC:/vcpkg/installed/x86-windows-static/lib -lhidapi -lsetupapi
    main: ./cmd/hardware-wallet/
    ldflags: -s -w -X github.com/skycoin/skywire/pkg/skywire-utilities/pkg/buildinfo.version=v{{.Version}} -X github.com/skycoin/skywire/pkg/skywire-utilities/pkg/buildinfo.commit={{.ShortCommit}} -X github.com/skycoin/skywire/pkg/skywire-utilities/pkg/buildinfo.date={{.Date}}

archives:
  - id: amd64
    format: zip
    name_template: 'skycoin-v{{ .Version }}-{{ .Os }}-{{ .Arch }}'
    builds:
      - skycoin-amd64
      - skyhw-amd64
    files:
      - none*

  - id: 386
    format: zip
    name_template: 'skycoin-v{{ .Version }}-{{ .Os }}-{{ .Arch }}'
    builds:
      - skycoin-386
      - skyhw-386
    files:
      - none*

checksum:
  name_template: 'checksums.txt'
snapshot:
  version_template: "{{ .Tag }}-next"
changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
