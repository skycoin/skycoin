version: "2"
run:
  concurrency: 4
  modules-download-mode: vendor
  issues-exit-code: 1
  tests: true
output:
  formats:
    text:
      path: stdout
      print-linter-name: true
      print-issued-lines: true
      colors: true
linters:
  default: none
  enable:
    - errcheck
    - gosec
    - ineffassign
    - misspell
    - nakedret
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    dupl:
      threshold: 100
    errcheck:
      check-type-assertions: false
      check-blank: true
    goconst:
      min-len: 3
      min-occurrences: 3
    gocyclo:
      min-complexity: 10
    lll:
      line-length: 120
      tab-width: 1
    misspell:
      locale: US
    nakedret:
      max-func-lines: 30
    prealloc:
      simple: true
      range-loops: true
      for-loops: false
    unparam:
      check-exported: false
    revive:
      rules:
        - name: package-comments
          disabled: true
  exclusions:
    generated: lax
    paths:
      - vendor/
      - third_party/
      - builtin$
      - examples$
      # npm dependencies of the Angular front-ends. The flatted package ships a
      # Go file that `./...` would otherwise walk into.
      - (^|/)node_modules/
      # cgo against libusb and hidapi, which the lint jobs on darwin and
      # windows do not install.
      - cmd/hardware-wallet
      - src/hardware-wallet/usb/lowlevel/
    rules:
      - linters:
          - staticcheck
        text: "QF1003:" # could use tagged switch on errCode (staticcheck)
      - linters:
          - staticcheck
        text: "ST1005:" # error strings should not be capitalized (staticcheck)
      - linters:
          - staticcheck
        text: "QF1008:" # could remove embedded field "Common" from selector (staticcheck)
      - linters:
          - staticcheck
        text: "QF1001:" # could apply De Morgan's law (staticcheck)
      - linters:
          - staticcheck
        text: "QF1002:" # could use tagged switch on rs.Type (staticcheck)
      - linters:
          - staticcheck
        text: "QF1010:" # could convert argument to string (staticcheck)
      - linters:
          - staticcheck
        text: "QF1004:" # could use strings.ReplaceAll instead (staticcheck)
      - linters:
          - staticcheck
        text: "QF1006:" # could lift into loop condition (staticcheck)
      - linters:
          - staticcheck
        text: "QF1012:" # could use fmt.Fprintf instead of WriteString(fmt.Sprintf) (staticcheck)
      # skycoin only. gosec scoped by path rather than silenced globally: each
      # is one intentional pattern repeated across a kind of file, and genuine
      # one-offs elsewhere carry //nolint with a reason at the site.
      - linters:
          - gosec
        text: "G101:" # test vectors, not credentials
        path: _test\.go
      - linters:
          - gosec
        text: "G404:" # shuffled test inputs, not secrets
        path: _test\.go
      - linters:
          - gosec
        text: "G117:" # fixtures that intentionally carry a password field
        path: _test\.go
      - linters:
          - gosec
        text: "G115:" # deliberate truncation while packing bytes
        path: "src/(cipher|btc)/"
      # G120 is taint-based and reports a different subset of the node's HTTP
      # handlers on each run, so per-site //nolint cannot keep up. The API
      # server sets its own body limits and these calls read one query value.
      - linters:
          - gosec
        text: "G120:"
        path: "src/api/"
      # Package names such as util and api are the public import paths of the
      # skycoin library, so renaming them would break every importer.
      - linters:
          - revive
        text: "var-naming: avoid meaningless package names"
      - linters:
          - revive
        text: "var-naming: avoid package names that conflict with Go standard library"
      # The BIP39 word lists are data in other languages, not English prose.
      - linters:
          - misspell
        path: src/cipher/bip39/wordlists/
issues:
  new: false
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/skycoin/skycoin
  exclusions:
    generated: lax
    paths:
      - vendor/
      - third_party/
      - builtin$
      - examples$
      - (^|/)node_modules/
