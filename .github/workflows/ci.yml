on: [pull_request]
name: CI

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: src/gui/static/package-lock.json

      - name: Install Dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb libusb-1.0-0-dev

      - name: Start Xvfb
        run: |
          Xvfb -ac :99 -screen 0 1280x1024x16 &
          echo "DISPLAY=:99" >> $GITHUB_ENV

      - name: Vendor Dependencies
        run: go mod vendor -v

      - name: Install linters
        run: make install-linters

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.3

      - name: Format Check
        run: |
          make format
          git diff --exit-code || (echo "Code is not formatted. Run 'make format' locally." && exit 1)

      - name: Check newcoin Template
        run: make check-newcoin

      - name: Check newcoin Templates Round-Trip
        run: make check-newcoin-templates

      - name: Check cmd/release Builds Without CGO
        run: make check-release-nocgo

      - name: Install UI Dependencies
        run: make install-deps-ui

      - name: Test UI
        run: make test-ui

      - name: Build UI
        run: make build-ui

      - name: Run Unit Tests (amd64)
        run: make test-amd64

      - name: Run Unit Tests (386)
        run: make test-386

      - name: Run Integration Tests
        run: |
          make integration-test-stable
          make integration-test-stable-disable-wallet-api
          make integration-test-stable-enable-seed-api
          make integration-test-stable-disable-gui
          make integration-test-stable-disable-csrf
          make integration-test-stable-auth

      - name: Run Fibercoin Integration Test
        run: make integration-test-fibercoin

      - name: Test Hardware Wallet Libraries
        run: make test-skyhw

      - name: Lint Hardware Wallet Code
        run: make lint-skyhw

      - name: Build Hardware Wallet Binary
        run: make build-skyhw

      - name: Test Hardware Wallet CLI
        shell: bash
        run: |
          set -e
          ./skyhw help
          ./skyhw daemon --help
          ./skyhw cli --help
          echo "Hardware wallet CLI compiled and tested successfully"

  darwin:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: go.sum

      - name: Install Dependencies
        run: |
          brew install --quiet libusb || brew upgrade --quiet libusb
          brew install --quiet hidapi || brew upgrade --quiet hidapi
          echo "CGO_CFLAGS=-I$(brew --prefix)/include" >> $GITHUB_ENV
          echo "CGO_LDFLAGS=-L$(brew --prefix)/lib" >> $GITHUB_ENV

      - name: Vendor Dependencies
        run: go mod vendor -v

      - name: Install linters
        run: make install-linters

      - name: Lint Go
        run: make lint

      - name: Format Check
        run: |
          make format
          git diff --exit-code || (echo "Code is not formatted. Run 'make format' locally." && exit 1)

      - name: Check newcoin Template
        run: make check-newcoin

      - name: Run Unit Tests
        run: make test

      - name: Run Unit Tests (386)
        run: make test-386

      - name: Test Hardware Wallet Libraries
        run: make test-skyhw

      - name: Build Hardware Wallet Binary
        run: make build-skyhw

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: go.sum

      - name: Install Requirements
        shell: pwsh
        run: |
          choco install make
          # Install libusb, hidapi, and pkg-config via msys2/mingw for x64
          C:\msys64\usr\bin\bash.exe -lc "pacman -S --noconfirm mingw-w64-x86_64-libusb mingw-w64-x86_64-hidapi mingw-w64-x86_64-pkg-config"
          # Add msys2 mingw64 to PATH for finding libraries and pkg-config
          echo "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "CGO_CFLAGS=-IC:/msys64/mingw64/include" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "CGO_LDFLAGS=-LC:/msys64/mingw64/lib" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Vendor Dependencies
        run: go mod vendor -v

      - name: Check newcoin Template
        run: make check-newcoin

      - name: Run Unit Tests (amd64)
        run: make test-amd64

      - name: Run Unit Tests
        run: make test

      - name: Test Hardware Wallet Libraries
        run: make test-skyhw

      - name: Build Hardware Wallet Binary
        run: make build-skyhw
