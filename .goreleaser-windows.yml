# GoReleaser configuration for Windows builds  
# Builds skycoin and skyhw binaries for Windows

version: 2

release:
  github:
    owner: skycoin
    name: skycoin

before:
  hooks:
    - go mod tidy
    - go mod vendor

builds:
  - id: skycoin
    binary: skycoin
    goos:
      - windows
    goarch:
      - amd64
      - 386
      - arm64
    env:
      - CGO_ENABLED=1
    main: ./
    ldflags: -s -w -X github.com/skycoin/skywire/pkg/skywire-utilities/pkg/buildinfo.version=v{{.Version}} -X github.com/skycoin/skywire/pkg/skywire-utilities/pkg/buildinfo.commit={{.ShortCommit}} -X github.com/skycoin/skywire/pkg/skywire-utilities/pkg/buildinfo.date={{.Date}}

  - id: skyhw
    binary: skyhw
    goos:
      - windows
    goarch:
      - amd64
      - 386
      - arm64
    env:
      - CGO_ENABLED=1
    main: ./cmd/hardware-wallet/
    ldflags: -s -w -X github.com/skycoin/skywire/pkg/skywire-utilities/pkg/buildinfo.version=v{{.Version}} -X github.com/skycoin/skywire/pkg/skywire-utilities/pkg/buildinfo.commit={{.ShortCommit}} -X github.com/skycoin/skywire/pkg/skywire-utilities/pkg/buildinfo.date={{.Date}}

archives:
  - id: archive
    format: zip
    name_template: 'skycoin-v{{ .Version }}-{{ .Os }}-{{ .Arch }}'
    builds:
      - skycoin
      - skyhw
    files:
      - none*

nfpms:
  - id: skycoin-msi
    package_name: skycoin
    builds:
      - skycoin
      - skyhw
    vendor: Skycoin
    homepage: https://skycoin.com
    maintainer: Skycoin Team
    description: Skycoin digital currency
    license: MIT
    formats:
      - msi
    file_name_template: 'skycoin-v{{ .Version }}-{{ .Os }}-{{ .Arch }}'

checksum:
  name_template: 'checksums.txt'
snapshot:
  version_template: "{{ .Tag }}-next"
changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
