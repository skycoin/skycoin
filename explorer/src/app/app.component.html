<div class="app">
  <!-- App header -->
  @if (!headerConfig.useGenericHeader) {
    <app-header></app-header>
  }
  @if (headerConfig.useGenericHeader) {
    <app-generic-header></app-generic-header>
  }
  <div class="wrapper">
    <app-search-bar></app-search-bar>
    <!-- Main page content -->
    <router-outlet></router-outlet>
  </div>
</div>
<!-- App footer -->
@if (!footerConfig.useGenericFooter) {
  <app-footer></app-footer>
}
@if (footerConfig.useGenericFooter) {
  <app-generic-footer></app-generic-footer>
}
