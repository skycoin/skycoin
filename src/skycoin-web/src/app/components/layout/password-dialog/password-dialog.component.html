<app-modal class="modal" [headline]="(data.title || 'password.title') | translate" [dialog]="dialogRef">
  @if (data.text) {
    <p>{{ data.text | translate }}</p>
  }
  <div [formGroup]="form">
    <div class="form-field">
      <label for="password">{{ 'password.label' | translate }}</label>
      <input formControlName="password" id="password" type="password" autocomplete="off" (keydown.enter)="submit()">
    </div>
    @if (data.confirm) {
      <div class="form-field">
        <label for="confirm">{{ 'password.confirm-label' | translate }}</label>
        <input formControlName="confirm" id="confirm" type="password" autocomplete="off" (keydown.enter)="submit()">
        @if (mismatch) {
          <div class="-error">{{ 'password.mismatch' | translate }}</div>
        }
      </div>
    }
  </div>
  <div class="-buttons">
    <app-button (action)="cancel()">{{ 'password.cancel-button' | translate }}</app-button>
    <app-button (action)="submit()" class="primary" [disabled]="!form.valid">{{ 'password.button' | translate }}</app-button>
  </div>
</app-modal>
