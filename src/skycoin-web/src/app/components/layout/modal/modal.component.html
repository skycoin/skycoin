<div class="-header">
  {{ headline }} @if (!disableDismiss) {
  <img src="assets/img/close-grey.png" class="btn-close" (click)="closePopup()">
}
</div>
<div [ngClass]="{'progress-bar-panel': loadingProgress === 0}"></div>
@if (loadingProgress > 0) {
  <mat-progress-bar
    color="primary"
    [mode]="'determinate'"
    [value]="loadingProgress">
  </mat-progress-bar>
}
<div class="-body">
  <mat-dialog-content>
    <ng-content></ng-content>
  </mat-dialog-content>
</div>
