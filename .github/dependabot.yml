# Dependabot configuration.
#
# Updates are grouped so each ecosystem/directory produces a small number of
# batched PRs instead of one PR per dependency. Security updates are always
# raised individually by Dependabot regardless of grouping.
version: 2
updates:
  # Go modules (root)
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      go-dependencies:
        patterns:
          - "*"

  # GitHub Actions workflows
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"

  # Blockchain explorer web app
  - package-ecosystem: npm
    directory: "/explorer"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      explorer-npm:
        patterns:
          - "*"
    ignore:
      # See the note on TypeScript majors at the bottom of this file.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # Skycoin web wallet
  - package-ecosystem: npm
    directory: "/src/skycoin-web"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      skycoin-web-npm:
        patterns:
          - "*"
    ignore:
      # See the note on TypeScript majors at the bottom of this file.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # Desktop GUI (Angular)
  - package-ecosystem: npm
    directory: "/src/gui/static"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      gui-npm:
        patterns:
          - "*"
    ignore:
      # See the note on TypeScript majors at the bottom of this file.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # SkyDEX trading UI (React/Vite)
  - package-ecosystem: npm
    directory: "/cmd/skydex-client"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      skydex-client-npm:
        patterns:
          - "*"

# TypeScript majors are ignored for the three Angular front-ends
# (/explorer, /src/gui/static, /src/skycoin-web).
#
# Angular pins a single TypeScript minor per major release: @angular/compiler-cli
# 22.1.1 declares "typescript": ">=6.0 <6.1", so TypeScript 7 cannot be installed
# alongside Angular 22. Dependabot would otherwise re-raise an unmergeable
# typescript 6.0.x -> 7.x PR every week.
#
# Angular declined to widen the range for 22.x (angular/angular#69704 and #69719,
# both closed as not planned). TypeScript 7 is the Go rewrite and does not yet
# expose the stable programmatic API that Angular's template type-checker needs.
#
# Remove these ignore entries when upgrading to an Angular major that supports
# TypeScript 7; check https://angular.dev/reference/versions for the mapping.
