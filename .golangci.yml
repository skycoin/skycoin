version: "2"
run:
  concurrency: 4
  modules-download-mode: vendor
  issues-exit-code: 1
  tests: true
output:
  formats:
    text:
      path: stdout
      print-linter-name: true
      print-issued-lines: true
      colors: true
linters:
  default: none
  enable:
    - errcheck
    - gosec
    - ineffassign
    - misspell
    - nakedret
    - revive
    - staticcheck
    - unparam
    - unused
    - misspell
    - unparam
    - revive
    - unconvert
    - unparam
  settings:
    dupl:
      threshold: 100
    errcheck:
      check-type-assertions: false
      check-blank: true
    goconst:
      min-len: 3
      min-occurrences: 3
    gocyclo:
      min-complexity: 10
    lll:
      line-length: 120
      tab-width: 1
    misspell:
      locale: US
    nakedret:
      max-func-lines: 30
    prealloc:
      simple: true
      range-loops: true
      for-loops: false
    unparam:
      check-exported: false
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
    rules:
      - linters:
          - misspell
        path: src/cipher/bip39/wordlists/
      - linters:
          - staticcheck
        text: "QF1003:" # could use tagged switch on errCode (staticcheck)
      - linters:
          - staticcheck
        text: "ST1005:" # error strings should not be capitalized (staticcheck)
      - linters:
          - staticcheck
        text: "QF1008:" # could remove embedded field "Common" from selector (staticcheck)
      - linters:
          - staticcheck
        text: "QF1001:" # could apply De Morgan's law (staticcheck)
      - linters:
          - staticcheck
        text: "QF1002:" # could use tagged switch on rs.Type (staticcheck)
      - linters:
          - staticcheck
        text: "QF1010:" # could convert argument to string (staticcheck)
      - linters:
          - staticcheck
        text: "QF1004:" # could use strings.ReplaceAll instead (staticcheck)
      - linters:
          - staticcheck
        text: "QF1006:" # could lift into loop condition (staticcheck)
issues:
  new: false
formatters:
  enable:
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/skycoin/skycoin
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
