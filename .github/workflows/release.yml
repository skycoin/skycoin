name: Release

on:
  push:
    tags:
      - '*'

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      
      - name: Cache musl toolchains
        uses: actions/cache@v5
        with:
          path: musl-data
          key: musl-cross-v1.3.29-${{ runner.os }}-${{ hashFiles('ci-scripts/build-libusb-musl.sh') }}
          restore-keys: |
            musl-cross-v1.3.29-${{ runner.os }}-
      
      - name: Install Requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y libusb-1.0-0-dev
      
      - name: Releasing
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          make dep-github-release
          make github-release

  darwin-amd64:
    needs: linux
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      
      - name: Install Requirements
        run: |
          brew install --quiet libusb || brew upgrade --quiet libusb
          brew install --quiet hidapi || brew upgrade --quiet hidapi
          brew install --quiet jq || brew upgrade --quiet jq
          brew install --quiet wget || brew upgrade --quiet wget
      
      - name: Releasing
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make github-release-darwin-amd64

  darwin-arm64:
    needs: linux
    runs-on: macos-latest  # ARM64 runner
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      
      - name: Install Requirements
        run: |
          brew install --quiet libusb || brew upgrade --quiet libusb
          brew install --quiet hidapi || brew upgrade --quiet hidapi
          brew install --quiet jq || brew upgrade --quiet jq
          brew install --quiet wget || brew upgrade --quiet wget
      
      - name: Releasing
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make github-release-darwin-arm64

  darwin-installer:
    needs: [darwin-amd64, darwin-arm64]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      
      - name: Install Requirements
        run: |
          brew install --quiet jq || brew upgrade --quiet jq
          brew install --quiet wget || brew upgrade --quiet wget
      
      - name: Create and Upload macOS Installers
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make mac-installer-release

  windows:
    needs: darwin-installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      
      - name: Install Requirements
        shell: pwsh
        run: |
          choco install make
          # Install libusb and hidapi via msys2/mingw for x64 only
          # 32-bit (i686) packages not available in default msys2 repos
          C:\msys64\usr\bin\bash.exe -lc "pacman -S --noconfirm mingw-w64-x86_64-libusb mingw-w64-x86_64-hidapi"
      
      - name: Releasing
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          make github-release-windows
          make windows-installer-release
