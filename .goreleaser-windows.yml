# GoReleaser configuration for Windows builds  
# Builds skycoin and skyhw binaries for Windows

version: 2

release:
  github:
    owner: skycoin
    name: skycoin

before:
  hooks:
    - go mod tidy
    - go mod vendor

builds:
  - id: skycoin-amd64
    binary: skycoin
    goos:
      - windows
    goarch:
      - amd64
    env:
      - CGO_ENABLED=1
      - PKG_CONFIG_PATH=C:/msys64/mingw64/lib/pkgconfig
      - CGO_CFLAGS=-IC:/msys64/mingw64/include
      - CGO_LDFLAGS=-LC:/msys64/mingw64/lib
    main: ./
    ldflags: -s -w -X github.com/skycoin/skywire/pkg/skywire-utilities/pkg/buildinfo.version=v{{.Version}} -X github.com/skycoin/skywire/pkg/skywire-utilities/pkg/buildinfo.commit={{.ShortCommit}} -X github.com/skycoin/skywire/pkg/skywire-utilities/pkg/buildinfo.date={{.Date}}

  - id: skyhw-amd64
    binary: skyhw
    goos:
      - windows
    goarch:
      - amd64
    env:
      - CGO_ENABLED=1
      - PKG_CONFIG_PATH=C:/msys64/mingw64/lib/pkgconfig
      - CGO_CFLAGS=-IC:/msys64/mingw64/include -IC:/msys64/mingw64/include/libusb-1.0
      - CGO_LDFLAGS=-LC:/msys64/mingw64/lib
    main: ./cmd/hardware-wallet/
    ldflags: -s -w -X github.com/skycoin/skywire/pkg/skywire-utilities/pkg/buildinfo.version=v{{.Version}} -X github.com/skycoin/skywire/pkg/skywire-utilities/pkg/buildinfo.commit={{.ShortCommit}} -X github.com/skycoin/skywire/pkg/skywire-utilities/pkg/buildinfo.date={{.Date}}

  - id: skycoin-386
    binary: skycoin
    goos:
      - windows
    goarch:
      - 386
    env:
      - CGO_ENABLED=0
    main: ./
    ldflags: -s -w -X github.com/skycoin/skywire/pkg/skywire-utilities/pkg/buildinfo.version=v{{.Version}} -X github.com/skycoin/skywire/pkg/skywire-utilities/pkg/buildinfo.commit={{.ShortCommit}} -X github.com/skycoin/skywire/pkg/skywire-utilities/pkg/buildinfo.date={{.Date}}

  - id: skycoin-arm64
    binary: skycoin
    goos:
      - windows
    goarch:
      - arm64
    env:
      - CGO_ENABLED=0
    main: ./
    ldflags: -s -w -X github.com/skycoin/skywire/pkg/skywire-utilities/pkg/buildinfo.version=v{{.Version}} -X github.com/skycoin/skywire/pkg/skywire-utilities/pkg/buildinfo.commit={{.ShortCommit}} -X github.com/skycoin/skywire/pkg/skywire-utilities/pkg/buildinfo.date={{.Date}}

archives:
  - id: amd64
    formats:
      - zip
    name_template: 'skycoin-v{{ .Version }}-{{ .Os }}-{{ .Arch }}'
    ids:
      - skycoin-amd64
      - skyhw-amd64
    files:
      - none*

  - id: 386
    formats:
      - zip
    name_template: 'skycoin-v{{ .Version }}-{{ .Os }}-{{ .Arch }}'
    ids:
      - skycoin-386
    files:
      - none*

  - id: arm64
    formats:
      - zip
    name_template: 'skycoin-v{{ .Version }}-{{ .Os }}-{{ .Arch }}'
    ids:
      - skycoin-arm64
    files:
      - none*

checksum:
  name_template: 'checksums.txt'
snapshot:
  version_template: "{{ .Tag }}-next"
changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
