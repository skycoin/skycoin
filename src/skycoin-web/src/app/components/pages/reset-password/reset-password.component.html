<div class="sky-container sky-container-grey">
  <app-header [headline]="'reset.title' | translate"></app-header>
  <div class="container">
    <div class="-paper reset-paper">
      <div [formGroup]="form">
        <div class="form-field">
          <label for="reset-wallet">{{ 'reset.wallet-label' | translate }}</label>
          <input id="reset-wallet" [value]="wallet ? wallet.label : ''" readonly />
        </div>
        <div class="form-field">
          <label for="reset-seed">{{ 'reset.seed-label' | translate }}</label>
          <textarea formControlName="seed" id="reset-seed" rows="2" autocomplete="off"></textarea>
        </div>
        @if (needsPassphrase) {
          <div class="form-field">
            <label for="reset-passphrase">{{ 'reset.passphrase-label' | translate }}</label>
            <input formControlName="passphrase" id="reset-passphrase" type="password" autocomplete="off" />
          </div>
        }
        <div class="form-field">
          <label for="reset-password">{{ 'reset.password-label' | translate }}</label>
          <input formControlName="password" id="reset-password" type="password" autocomplete="new-password" />
        </div>
        <div class="form-field">
          <label for="reset-confirm">{{ 'reset.confirm-label' | translate }}</label>
          <input formControlName="confirm" id="reset-confirm" type="password" autocomplete="new-password" (keydown.enter)="reset()" />
          @if (mismatch) {
            <div class="-error">{{ 'reset.confirm-error-info' | translate }}</div>
          }
        </div>
      </div>
      <div class="-buttons">
        <app-button #resetButton (action)="reset()" class="primary" [disabled]="!form.valid || busy || !wallet">
          {{ 'reset.reset-button' | translate }}
        </app-button>
      </div>
    </div>
  </div>
</div>
