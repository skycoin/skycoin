<app-modal [headline]="'qr.title' | translate" [dialog]="dialogRef">
  <!-- QR code. -->
  <div class="qr-container">
    <div #qrArea class="qr"></div>
  </div>
  <!-- Info. -->
  <div class="separator"></div>
  @if (!data.showAddressOnly) {
    <div class="data-container">
      <div class="title">{{ 'qr.data-label' | translate }}</div>
      <div class="data" (click)="copyText(currentQrContent)"><span class="text">{{ currentQrContent }}</span><span class="fa copy">&#xf0c5;</span></div>
    </div>
  }
  <div class="data-container">
    <div class="title">{{ 'qr.address-label' | translate }}</div>
    <div class="data" (click)="copyText(data.address)"><span class="text">{{ data.address }}</span><span class="fa copy">&#xf0c5;</span></div>
  </div>

  @if (!formVisible && !data.showAddressOnly) {
    <app-arrow-link
      [text]="'qr.request-link'"
      (pressed)="showForm()"
      [noPadding]="true">
    </app-arrow-link>
  }

  <!-- Form. -->
  @if (formVisible) {
    <div class="separator form-separator"></div>
  }
  @if (formVisible) {
    <div [formGroup]="form">
      <div class="form-field">
        <label for="coins">
          {{ 'qr.amount-label' | translate }} @if (invalidCoins) {
          <span class="red-text">{{ 'qr.invalid' | translate }}</span>
        }
      </label>
      <input appFormatNumber maxlength="20" formControlName="coins" id="coins">
    </div>
    <div class="form-field">
      <label for="hours">
        {{ 'qr.hours-label' | translate }} @if (invalidHours) {
        <span class="red-text">{{ 'qr.invalid' | translate }}</span>
      }
    </label>
    <input appFormatNumber maxlength="20" formControlName="hours" id="hours">
  </div>
  <div class="form-field">
    <label for="note">
      {{ 'qr.message-label' | translate }}
    </label>
    <input maxlength="100" formControlName="note" id="note">
  </div>
</div>
}
</app-modal>
